[package]
name = "harper-py"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "_harper"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# Same crates and features as harper-wasm 2.11.0 (default features: typst, thesaurus).
harper-core = { version = "=2.11.0", default-features = false, features = ["thesaurus"] }
harper-stats = "=2.11.0"
harper-typst = "=2.11.0"
serde = "1"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

name: wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux x86_64, os: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { name: manylinux aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { name: musllinux x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: musllinux aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos arm64, os: macos-14, target: aarch64-apple-darwin, python-arch: arm64 }
          - { name: macos x86_64, os: macos-14, target: x86_64-apple-darwin, python-arch: x64 }
          - { name: windows x64, os: windows-2022, target: x86_64-pc-windows-msvc, python-arch: x64 }
          - { name: windows arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, python-arch: arm64 }
    steps:
      - uses: actions/checkout@v7

      # x64 Python on the arm64 macOS runner runs under Rosetta, so the x86_64 wheel is tested too.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-arch }}

      # abi3-py310: one wheel per platform covers CPython 3.10+.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"

      - name: Test the wheel
        if: ${{ !matrix.manylinux || matrix.manylinux == 'auto' }}
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest hypothesis
          python -m pytest tests

      - name: Test the wheel on Alpine
        if: matrix.manylinux == 'musllinux_1_2'
        run: >
          docker run --rm -v "$PWD:/io" -w /io python:3.13-alpine
          sh -c "pip install dist/*.whl pytest hypothesis && python -m pytest tests"

      # The floor of abi3 and the newest interpreter. One runner is enough: the abi3
      # boundary is per interpreter, not per platform.
      - uses: actions/setup-python@v7
        if: matrix.name == 'manylinux x86_64'
        with:
          python-version: |
            3.10
            3.14
          allow-prereleases: true

      - name: Test the wheel on Python 3.10 and 3.14
        if: matrix.name == 'manylinux x86_64'
        run: |
          for v in 3.10 3.14; do
            python$v -m venv /tmp/venv$v
            /tmp/venv$v/bin/pip install dist/*.whl pytest hypothesis
            /tmp/venv$v/bin/python -m pytest tests
          done

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Install from sdist and run tests
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz pytest hypothesis
          /tmp/sdist-venv/bin/python -m pytest tests

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
